  <!-- ==============nav bar all pages(responsive) ============== -->

                <li><a class="linkhref" href="../../index.html"><i class="fa-solid fa-house icon"></i><span>Home</span></a></li>
                <li><a class="linkhref" href="q-all.html"><i class="fa-solid fa-flag icon"></i><span>quest</span></a></li>

            <ul class="about">
                <li><a class="linkhref" href="about.html"><i class="fa-solid fa-circle-info"></i></a></li>

                    <button id="theme-switch">
                        <i class="fa-solid fa-sun"></i>

            </ul>

        <ul>
            
            <ul class="mainIcon">
                <li class="menu-button"><i width="26" height="26" class="fa-solid fa-bars"></i></a></li>     
            </ul>
            <li class="logo"><a class="linkhref thaipattaya">CookQuest</a></li>
            <ul class="titlebar">
                <li class="hideOnMobile"><a class="linkhref" href="../../index.html">Home</a></li>
                <li class="hideOnMobile"><a class="linkhref" href="q-all.html">quest</a></li>
            </ul>

            <div class="auth-section" id="auth-section">    
                <a class="linkhref login-btn" href="login.html" id="login-btn">Login</a>

                <div class="user-profile hidden" id="user-profile">
                    <i class="fa-solid fa-circle-user user-icon" id="user-icon-trigger"></i>
                    
                    <ul class="profile-dropdown hidden" id="profile-dropdown">
                        <a class="profilehref" href="profile.html">
                            <li class="dropdown-item">
                                    <i class="fa-solid fa-user"></i>
                                    <span>Profile</span>
                            </li>
                        </a>

                            <i class="fa-solid fa-circle-half-stroke"></i>
                            <span>Theme</span>
                            <div class="theme-selector-wrapper">
                                <button class="theme-select-trigger" id="theme-select-trigger">
                                    <span id="current-theme-text">Light</span>
                                    <i class="fa-solid fa-caret-down"></i>
                                </button>

                                <div class="theme-options hidden" id="theme-options">
                                    <div class="theme-option" data-value="light">Light</div>
                                    <div class="theme-option" data-value="dark">Dark</div>
                                </div>

    <!-- ==============search Quest page content ============== -->
    <div class="container-main">
        <div class="search-container">
            <span class="search-label thai">ค้นหา</span>
            <input type="text" class="search-input thai" placeholder="ชื่อเมนู, ส่วนผสม">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <nav class="top-nav">
            <a href="q-all.html" class="nav-link active"><span class="thai">ทั้งหมด</span></a>
            <a href="q-pending.html" class="nav-link"><span class="thai">รอดำเนินการ</span></a>
            <a href="q-complete.html" class="nav-link"><span class="thai">เสร็จสิ้น</span></a>
            <a href="q-self.html" class="nav-link"><span class="thai">บันทึกสูตร</span></a>
        </nav>

        <main class="content-container" id="detail-main">
            <section class ="category-container">
                <div>
                    <span class="category-header">C</span>
                    <span class ="category-title thai">4 จตุรเทพสเต็ก</span>
                </div>
                <div class="sort-container">
                    <button class="sort-btn" id="sortBtn"><i class="fa-solid fa-list"></i></button>
                    <div class="sort-dropdown hidden" id="sortDropdown">
                        <div class="sort-row">
                            <span class="sort-label">Name</span>
                            <select id="sortName" class="sort-select">
                                <option value="none">เลือก</option>
                                <option value="asc">ก → ฮ</option>
                                <option value="desc">ฮ → ก</option>
                            </select>
                        </div>
                        <div class="sort-row">
                            <span class="sort-label">Exp</span>
                            <select id="sortExp" class="sort-select">
                                <option value="none">เลือก</option>
                                <option value="low">น้อย → มาก</option>
                                <option value="high">มาก → น้อย</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <section id="questList" class="quest-section">
                <div class="quest-card" data-name="สเต็ก4" data-exp="1000">
                    <span class="quest-title-wrapper">
                        <h2 class="quest-title thaipattaya">สเต็กหมู</h2>
                        <i class="fa-regular fa-star"></i>
                    </span>
                    <figure class="quest-image">
                        <img src="../../assets/img/steak1.png" alt="steak">
                    </figure>
                    <div class="menu-footer">
                        <span class="time"><i class="fa-solid fa-clock"></i> 30 นาที</span>
                        <span class="exp"><i class="fa-solid fa-star"></i> 1000 EXP</span>
                    </div>
                </div>

                <div class="quest-card locked" data-name="สเต็ก6" data-exp="2000">
                    <span class="quest-title-wrapper">
                        <h2 class="quest-title thaipattaya">สเต็ก2</h2>
                        <i class="fa-regular fa-star"></i>
                    </span>
                    <figure class="quest-image">
                        <img src="../../assets/img/steak2.png" alt="steak">
                        <div class="lock-overlay">
                            <i class="fa-solid fa-lock"></i><span class="gold-text">GOLD</span>
                        </div>
                    </figure>
                    <div class="menu-footer">
                        <span class="time"><i class="fa-solid fa-clock"></i> 60 นาที</span>
                        <span class="exp"><i class="fa-solid fa-star"></i> 2000 EXP</span>
                    </div>
                </div>

                <div class="quest-card locked" data-name="สเต็ก1" data-exp="100">
                    <span class="quest-title-wrapper">
                        <h2 class="quest-title thaipattaya">สเต็ก3</h2>
                        <i class="fa-regular fa-star"></i>
                    </span>
                    <figure class="quest-image">
                        <img src="../../assets/img/test.jpg" alt="steak">
                        <div class="lock-overlay">
                            <i class="fa-solid fa-lock"></i><span class="gold-text">GOLD</span>
                        </div>
                    </figure>
                    <div class="menu-footer">
                        <span class="time"><i class="fa-solid fa-clock"></i> 90 นาที</span>
                        <span class="exp"><i class="fa-solid fa-star"></i> 100 EXP</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
