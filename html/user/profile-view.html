        /* Nuclear Specificity: Force Navbar colors to remain correct in dark mode */
        body.darkmode .NL {

        body.darkmode .NL, body.darkmode .NL a,

    <!-- ============== Start  Script ============== -->
    <script>
        // Force unregister all Service Workers and clear caches to bypass old cached files
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let r of registrations) r.unregister();
            });
        }
        if (window.caches) {
            caches.keys().then(keys => { for (let key of keys) caches.delete(key); });
        }
    </script>

    <!-- ==============Profile view all page content ============== -->
     <div class="profile-container">

  <!-- Header -->
  <div class="view-header">
    <h2 style="display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-chart-pie header-icon"></i> Performance & Badges</h2>
    <a href="profile.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>
  </div>

  <!-- Level -->
  <div class="level-box">
    <div class="avatar"><i class="fa-solid fa-circle-user"></i></div>

    <div class="level-info">
      <div class="level-title" id="view-level-title">Loading...</div>

      <div class="xp-bar">
        <div class="xp-fill"></div>
      </div>

      <span class="xp-text" id="view-xp-text">...</span>
    </div>
  </div>

  <!-- Chart -->
  <h3 class="section-heading"><i class="fa-solid fa-chart-line header-icon"></i> Activity History</h3>
  <div class="chart-box">
    <canvas id="progressChart"></canvas>
  </div>

  <!-- Badge -->
  <h3 class="section-heading"><i class="fa-solid fa-medal header-icon"></i> Badge Collection</h3>

  <div class="badge-grid" id="view-badge-grid">
    <!-- Badges will be loaded dynamically from the database -->
  </div>

</div>
<!-- Badge Modal Overlay -->
<div id="badgeModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; justify-content: center; align-items: center;">
    <div class="modal-content badge-modal-content">
        <button id="closeBadgeModal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #888;">&times;</button>
        <div id="modalBadgeIcon" style="font-size: 60px; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;"></div>
        <h2 id="modalBadgeName" style="font-family: 'Pattaya', sans-serif;"></h2>
        <p id="modalBadgeDesc" class="thai"></p>
        <div id="modalBadgeStatus"></div>
    </div>
