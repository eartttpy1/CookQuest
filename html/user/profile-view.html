        }
        .xp-bar {

            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0;
            width: 100%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        body.darkmode .xp-bar {

            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .xp-fill {
            height: 100%;
            background: #ffffff;
            border-radius: 20px;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #view-xp-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .section-heading {
            font-size: 1.5rem;
            font-weight: 700;
            color: #800002; /* CookQuest Navbar Red */
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        body.darkmode .section-heading {
            color: #ff6a6c; /* Lighter red for dark mode contrast */
        }
        
        .avatar {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .chart-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            border: 1px solid #eaeaea;
        }
        body.darkmode .chart-box {
            background: #2a2a2a;
            border-color: #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }
        .badge-card {
            background: linear-gradient(145deg, #ffffff, #f9f9f9);
            border: 1px solid #eaeaea;
            border-radius: 20px;
            padding: 20px 15px;
            width: 120px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: default;
        }
        body.darkmode .badge-card {
            background: linear-gradient(145deg, #333, #2a2a2a);
            border-color: #444;
        }
        .badge-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px rgba(128, 0, 2, 0.2);
            border-color: #800002;
        }
        .badge-icon {

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(128, 0, 2, 0.4);
            transition: transform 0.3s ease;
        }
        .badge-card:hover .badge-icon {
            transform: scale(1.1) rotate(10deg);
        }
        .badge-card p {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: #444;
        }

     <div class="profile-container">

  <!-- Header -->
  <div class="view-header">
    <h2 style="display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-chart-pie" style="color: #800002;"></i> Performance & Badges</h2>
    <a href="profile.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Profile</a>
  </div>

  <!-- Level -->
  <div class="level-box">
    <div class="avatar"><i class="fa-solid fa-circle-user"></i></div>

    <div class="level-info">
      <div class="level-title" id="view-level-title">Loading...</div>

      <div class="xp-bar">
        <div class="xp-fill"></div>
      </div>

      <span class="xp-text" id="view-xp-text">...</span>
    </div>
  </div>

  <!-- Chart -->
  <h3 class="section-heading"><i class="fa-solid fa-chart-line" style="color: #800002;"></i> Activity History</h3>
  <div class="chart-box">
    <canvas id="progressChart"></canvas>
  </div>

  <!-- Badge -->
  <h3 class="section-heading"><i class="fa-solid fa-medal" style="color: #800002;"></i> Badge Collection</h3>

  <div class="badge-grid" id="view-badge-grid">
    <!-- Badges will be loaded dynamically from the database -->
  </div>

</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const userDataStr = localStorage.getItem('user_data');
      if (!userDataStr) return;
      const userData = JSON.parse(userDataStr);
      const userId = userData.user.id;
      const token = localStorage.getItem('authToken');

      // 1. Fetch real profile data (Level, XP, Rank)
      const profileRes = await axios.get('http://localhost:4000/api/profile', {
          headers: { Authorization: `Bearer ${token}` }
      });
      const profile = profileRes.data;
      
      // 2. Calculate and display Level, Rank, and XP Bar
      const levelSystem = {
        1: { rank: 'IRON Chef', minXP: 0, maxXP: 500 },
        2: { rank: 'BRONZE Chef', minXP: 501, maxXP: 1500 },
        3: { rank: 'SILVER Chef', minXP: 1501, maxXP: 3000 },
        4: { rank: 'GOLD Chef', minXP: 3001, maxXP: 5000 },
        5: { rank: 'PLATINUM Chef', minXP: 5001, maxXP: Infinity }
      };
      const lvl = profile.level || 1;
      const currentLevelData = levelSystem[lvl] || levelSystem[1];
      const xp = profile.xp || 0;
      const xpPercentage = Math.min(((xp - currentLevelData.minXP) / (currentLevelData.maxXP - currentLevelData.minXP)) * 100, 100);

      document.getElementById('view-level-title').textContent = `Level ${lvl} ${profile.rank || 'IRON Chef'}`;
      document.getElementById('view-xp-text').textContent = `${xp}/${currentLevelData.maxXP} XP`;
      document.querySelector('.xp-fill').style.width = `${xpPercentage}%`;

      // 3. Fetch the real history from MongoDB for Chart
      const response = await axios.get(`http://localhost:4000/api/history?userId=${userId}`);
      const historyData = response.data || [];

      // 1. Filter only 'approved' dishes and sort them by date (oldest to newest)
      const approvedDishes = historyData.filter(item => item.status === 'approved');
      approvedDishes.sort((a, b) => new Date(a.submittedAt || a.createdAt) - new Date(b.submittedAt || b.createdAt));

      // 2. Group the dishes by Date
      const dateCounts = {};
      approvedDishes.forEach(dish => {
        const date = new Date(dish.submittedAt || dish.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
        dateCounts[date] = (dateCounts[date] || 0) + 1;
      });

      const labels = Object.keys(dateCounts);
      const dailyCounts = Object.values(dateCounts);

      // 3. Make the data cumulative so the chart shows total progress over time
      let total = 0;
      const cumulativeData = dailyCounts.map(count => {
        total += count;
        return total;
      });

      // 4. Render the Chart
      const ctx = document.getElementById('progressChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['No Data'],
          datasets: [{
            label: 'Total Completed Dishes',
            data: cumulativeData.length ? cumulativeData : [0],
            borderColor: '#800002',
            backgroundColor: 'rgba(128, 0, 2, 0.15)',
            borderWidth: 3,
            fill: true,
            tension: 0.4, /* Makes the line graph much smoother */
            pointBackgroundColor: '#fff',
            pointBorderColor: '#800002',
            pointBorderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
          plugins: { legend: { display: false } }
        }
      });

      // 4. Render Earned Badges from Database
      const badgeGrid = document.getElementById('view-badge-grid');
      if (profile.badges && profile.badges.length > 0) {
          let badgeHTML = ``;
          profile.badges.forEach(badge => {
              badgeHTML += `
                <div class="badge-card"><div class="badge-icon">${badge.icon || '🏆'}</div><p>${badge.name}</p></div>
              `;
          });
          badgeGrid.innerHTML = badgeHTML;
      } else {
          badgeGrid.innerHTML = `
            <div style="width: 100%; text-align: center; padding: 40px 20px; opacity: 0.6;">
                <i class="fa-solid fa-award fa-3x" style="margin-bottom: 15px; color: #ccc;"></i>
                <p style="font-size: 1.1rem; margin: 0;">Start cooking to unlock badges!</p>
            </div>
          `;
      }
    } catch (err) {
      console.error('Failed to load progress chart:', err);
    }
  });
</script>
